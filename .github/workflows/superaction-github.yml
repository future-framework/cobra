# spf13/cobra's .github/workflows/test.yml: test-unix (platform: ubuntu, go: 24 -> 1.24.x), for the Superaction scoreboard.
name: Superaction (GitHub)

on:
  workflow_dispatch: {}

env:
  GO111MODULE: on

permissions:
  contents: read

jobs:
  test:
    name: test / github
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GO_TEST_FLAGS: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.x
          cache: true

      - run: |
          export GOBIN=$HOME/go/bin
          go install github.com/kyoh86/richgo@latest
          go install github.com/mitchellh/gox@latest

      - run: RICHGO_FORCE_COLOR=1 PATH=$HOME/go/bin/:$PATH make richtest
